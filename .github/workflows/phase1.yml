name: Phase 1 application checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: hostelxpress_test
          POSTGRES_PASSWORD: phase1_disposable_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hostelxpress_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: host=localhost port=5432 dbname=hostelxpress_test user=postgres password=phase1_disposable_only
      HOSTELXPRESS_TEST_DATABASE: disposable
      PYTHONPATH: services/api
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux test tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends python3-venv shellcheck
          python3 -m venv .venv
          .venv/bin/python -m pip install -r services/api/requirements-dev.txt
          .venv/bin/python -m pip install -e integrations/device_connector
      - name: Check backend and communication contracts
        run: |
          source .venv/bin/activate
          bash scripts/check_phase0.sh
          python -m pytest services/api/tests integrations/device_connector/tests -q

  student:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/student
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: npm
          cache-dependency-path: apps/student/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run export:web
